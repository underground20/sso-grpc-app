name: gRPC API tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose --env-file tests/.env -f docker-compose.test.yml up --build -d

      - name: Run Go tests
        run: docker compose --env-file tests/.env -f docker-compose.test.yml exec app go test -v -count=1 ./tests

      - name: Stop services
        if: always()
        run: docker compose --env-file tests/.env -f docker-compose.test.yml down
