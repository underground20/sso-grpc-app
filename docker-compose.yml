services:
    app:
        build:
            context: .
            dockerfile: build/app/Dockerfile
        env_file:
            - .env
        ports:
            - ${GRPC_PORT}:${GRPC_PORT}
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
    admin:
        build:
            context: .
            dockerfile: build/admin/Dockerfile
        env_file:
            - .env
        ports:
            - ${HTTP_PORT}:${HTTP_PORT}
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
    migrator:
        build:
            context: .
            dockerfile: build/migrator/Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        env_file:
            - .env
        command: [
            "-path=/migrations",
            "-database=${DATABASE_URL}",
            "up"
        ]
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        env_file:
            - .env
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
            interval: 10s
            timeout: 5s
            retries: 5